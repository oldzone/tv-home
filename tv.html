<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  :root{
    --bg1:#0b1020; --bg2:#1a1f3a; --bg3:#2a1d3d;
    --fg:#f5f5f7; --muted:rgba(245,245,247,.6);
    --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Roboto,Arial,sans-serif;}
  /* Animated wallpaper */
  .wall{position:fixed;inset:0;z-index:0;
    background:radial-gradient(1200px 800px at 15% 20%,#3b4cca55,transparent 60%),
               radial-gradient(1000px 700px at 85% 30%,#b0408055,transparent 60%),
               radial-gradient(1200px 900px at 50% 100%,#1fa2a655,transparent 60%),
               linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    background-size:140% 140%;animation:drift 40s ease-in-out infinite alternate}
  .wall.has-img{background-size:cover;background-position:center;filter:saturate(1.1)}
  .wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55) 70%,rgba(0,0,0,.8))}
  @keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}

  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:3.2vh 4.5vw 2vh}
  header{display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:2.1vh;letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;gap:1vh}
  .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:#ff453a;box-shadow:0 0 1vh #ff453a}
  .dot.on{background:#30d158;box-shadow:0 0 1vh #30d158}
  .clock{text-align:right}
  .clock .t{font-size:4.6vh;font-weight:600;letter-spacing:-.01em}
  .clock .d{font-size:1.9vh;color:var(--muted)}

  /* Top shelf */
  .shelf{margin-top:3vh;height:38vh;border-radius:calc(var(--radius) + 6px);position:relative;overflow:hidden;
    background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    display:flex;align-items:flex-end;padding:4vh 4vw;transition:transform .25s,box-shadow .25s;outline:none}
  .shelf .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
  .shelf .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.15) 70%)}
  .shelf .txt{position:relative;max-width:60%}
  .shelf .kicker{font-size:1.8vh;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:1vh}
  .shelf h1{font-size:5vh;font-weight:700;line-height:1.1;margin-bottom:1.2vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .shelf p{font-size:2vh;color:var(--muted);word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .shelf .pair{position:absolute;right:4vw;bottom:4vh;text-align:center}
  .shelf .pair .lbl{font-size:1.7vh;color:var(--muted);margin-bottom:.6vh}
  .shelf .pair .code{font-size:6vh;font-weight:700;letter-spacing:.25em;font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.35);padding:1vh 2vw;border-radius:16px}
  .shelf.focus{transform:scale(1.015);box-shadow:0 2.5vh 6vh rgba(0,0,0,.6),0 0 0 .4vh rgba(255,255,255,.85)}

  section{margin-top:2.6vh}
  section h2{font-size:2.3vh;font-weight:600;color:var(--muted);margin:0 0 1.4vh .4vw}
  .row{display:flex;gap:2vw;padding:2.5vh 1.6vw 2.5vh;margin:0 -1vw;overflow:hidden;scroll-behavior:smooth}

  .tile{flex:0 0 auto;width:15.5vw;aspect-ratio:16/10;border-radius:var(--radius);position:relative;
    display:flex;align-items:center;justify-content:center;outline:none;cursor:pointer;
    box-shadow:0 1vh 2.5vh rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
    overflow:visible}
  .tile .face{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden}
  .tile .face::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 40%);opacity:0;transition:opacity .25s}
  .tile .logo{position:relative;width:42%;max-height:62%;object-fit:contain;filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.25))}
  .tile .fallback{position:relative;font-size:3vh;font-weight:700;color:#fff;letter-spacing:-.01em}
  .tile .name{position:absolute;left:0;right:0;top:calc(100% + 1.4vh);text-align:center;font-size:2vh;font-weight:600;
    color:#fff;opacity:0;transform:translateY(-.6vh);transition:opacity .2s,transform .2s;white-space:nowrap}
  .tile.focus{transform:scale(1.13) translateY(-.4vh);z-index:2;box-shadow:0 3.5vh 6vh rgba(0,0,0,.65)}
  .tile.focus .face::after{opacity:1}
  .tile.focus .name{opacity:1;transform:none}
  #apps{padding-bottom:6vh}
  .hist .tile{width:22vw;aspect-ratio:16/9;align-items:flex-end;justify-content:flex-start;padding:1.6vh 1.2vw}
  .hist .tile .face{background:#1c1c24 center/cover no-repeat}
  .hist .tile .face.site{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2b2b3a,#15151d)}
  .hist .tile .face.site img{width:22%;opacity:.95}
  .hist .tile .shade{position:absolute;inset:0;border-radius:var(--radius);background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85))}
  .hist .tile span{position:relative;z-index:1;font-size:2vh;font-weight:600;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .hist .tile .host{position:absolute;top:1.3vh;left:1vw;z-index:1;font-size:1.5vh;font-weight:600;
    background:rgba(0,0,0,.45);padding:.4vh .7vw;border-radius:8px;color:#ddd}
  .empty{color:var(--muted);font-size:2vh;padding:2vh .6vw}

  footer{margin-top:auto;font-size:1.6vh;color:rgba(255,255,255,.35);display:flex;justify-content:space-between}

  /* Incoming toast */
  .toast{position:fixed;left:50%;top:6vh;transform:translate(-50%,-150%);z-index:10;
    background:rgba(30,30,32,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
    border-radius:28px;padding:2.2vh 2.4vw;min-width:44vw;max-width:70vw;display:flex;gap:1.6vw;align-items:center;
    box-shadow:0 3vh 8vh rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
  .toast.show{transform:translate(-50%,0)}
  .toast img{width:12vw;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#333}
  .toast .k{font-size:1.6vh;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .toast .h{font-size:2.6vh;font-weight:700;margin:.4vh 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .toast .u{font-size:1.6vh;color:var(--muted);word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .toast .bar{height:.5vh;border-radius:4px;background:rgba(255,255,255,.15);margin-top:1.2vh;overflow:hidden}
  .toast .bar i{display:block;height:100%;width:0;background:#fff}
  .toast .hint{font-size:1.5vh;color:var(--muted);margin-top:.8vh}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<div class="app">
  <header>
    <div class="brand"><div class="dot" id="dot"></div><span id="status">Bağlanıyor…</span></div>
    <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
  </header>

  <div class="shelf focusable" id="shelf" data-row="0" tabindex="0">
    <div class="bg" id="shelfBg"></div>
    <div class="txt">
      <div class="kicker" id="shelfKicker">Hoş geldin</div>
      <h1 id="shelfTitle">iPhone'dan bir link gönder</h1>
      <p id="shelfSub">Paylaş → TV'ye Gönder · gelen link burada otomatik açılır</p>
    </div>
    <div class="pair"><div class="lbl">TV kodu</div><div class="code" id="code">------</div></div>
  </div>

  <section>
    <h2>Uygulamalar</h2>
    <div class="row" id="apps"></div>
  </section>

  <section class="hist">
    <h2>Gönderilenler</h2>
    <div class="row" id="hist"></div>
  </section>

  <footer><span>← → ↑ ↓ ile gez · OK ile aç</span><span id="ver">tv-home</span></footer>
</div>

<div class="toast" id="toast">
  <img id="tImg" alt="">
  <div style="flex:1;min-width:0">
    <div class="k" id="tK">iPhone'dan geldi</div>
    <div class="h" id="tTitle"></div>
    <div class="u" id="tUrl"></div>
    <div class="bar" id="tBarW"><i id="tBar"></i></div>
    <div class="hint" id="tHint">Birazdan açılıyor · iptal için Geri</div>
  </div>
</div>

<script src="apps.js"></script>
<script>
/* ============ AYARLAR (istersen düzenle) ============ */
// Android TV paket adları. Tarayıcın intent:// linklerini destekliyorsa uygulama doğrudan açılır.
const APPS = window.TVHOME_APPS;
const NTFY = window.TVHOME_NTFY;
const OPEN_DELAY_MS = 4000;     // gelen link kaç ms sonra açılsın
const MAX_HIST = 20;
/* ==================================================== */

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ---- Pairing code ----
function genCode(){
  const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s="";
  const r=new Uint32Array(6); (crypto||window.msCrypto).getRandomValues(r);
  for(const x of r) s+=A[x%A.length]; return s;
}
let code = (location.hash.match(/k=([A-Z0-9]{4,12})/i)||[])[1];
if(code){ code=code.toUpperCase(); store.set("tvcode",code); }
else { code = store.get("tvcode",null) || genCode(); store.set("tvcode",code); }
$("code").textContent = code;
const topic = "tvhome-" + code;

// ---- Clock ----
function tick(){
  const n=new Date();
  $("time").textContent = n.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent = n.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,10000);

// ---- Helpers ----
function ytId(u){
  try{
    const x=new URL(u);
    if(x.hostname.includes("youtu.be")) return x.pathname.slice(1).split("/")[0];
    if(x.hostname.includes("youtube.com")){
      if(x.searchParams.get("v")) return x.searchParams.get("v");
      const m=x.pathname.match(/\/(shorts|live|embed)\/([\w-]{6,})/); if(m) return m[2];
    }
  }catch(e){}
  return null;
}
function thumb(u){ const id=ytId(u); return id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:null; }
const siteIcon = window.tvhomeIcon;
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function intentFor(url){
  const id=ytId(url);
  if(id){
    const fb=encodeURIComponent(url);
    return `intent://www.youtube.com/watch?v=${id}#Intent;scheme=https;package=com.google.android.youtube.tv;S.browser_fallback_url=${fb};end`;
  }
  return null;
}
const FULLY = (typeof window.fully!=="undefined") ? window.fully : null;
function toFront(){ try{ FULLY && FULLY.bringToForeground(); }catch(e){} }
function launch(url){
  const id=ytId(url);
  if(FULLY && id){
    try{ FULLY.startIntent(`intent://www.youtube.com/watch?v=${id}#Intent;scheme=https;package=com.google.android.youtube.tv;end`); return; }catch(e){}
  }
  const it=intentFor(url);
  if(it){ location.href=it; setTimeout(()=>{ if(document.visibilityState==="visible") location.href=url; },2500); }
  else location.href=url;
}
function launchApp(a){
  if(FULLY && a.pkg){ try{ FULLY.startApplication(a.pkg); return; }catch(e){} }
  if(a.settings){ location.href="intent:#Intent;action=android.settings.SETTINGS;end"; return; }
  if(a.pkg){
    const fb = a.web?`S.browser_fallback_url=${encodeURIComponent(a.web)};`:"";
    location.href=`intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${a.pkg};${fb}end`;
  } else if(a.web) location.href=a.web;
}

// ---- Apps row ----
APPS.forEach(a=>{
  const t=document.createElement("div");
  t.className="tile focusable"; t.tabIndex=0; t.dataset.row=1;
  const src=a.img||(a.domain?siteIcon(a.domain):null);
  t.innerHTML=`<div class="face" style="background:${a.bg}"></div>`+
    (src?`<img class="logo" src="${src}" alt="">`:`<div class="fallback" style="font-size:6vh">${a.icon||""}</div>`)+
    `<div class="name">${a.name}</div>`;
  const im=t.querySelector("img");
  if(im) im.onerror=()=>{ im.replaceWith(Object.assign(document.createElement("div"),{className:"fallback",textContent:a.name})); };
  t.onclick=()=>launchApp(a);
  $("apps").appendChild(t);
});

// ---- History ----
let hist = store.get("hist",[]);
function renderHist(){
  const box=$("hist"); box.innerHTML="";
  if(!hist.length){ box.innerHTML=`<div class="empty">Henüz bir şey gönderilmedi.</div>`; return; }
  hist.forEach(h=>{
    const t=document.createElement("div");
    t.className="tile focusable"; t.tabIndex=0; t.dataset.row=2;
    const th=thumb(h.url);
    const face=th?`<div class="face" style="background-image:url(${th})"></div>`
                 :`<div class="face site"><img src="${siteIcon(host(h.url))}" alt=""></div>`;
    t.innerHTML=`${face}<div class="shade"></div><div class="host">${esc(host(h.url))}</div><span>${esc(h.title||h.url)}</span>`;
    t.onclick=()=>launch(h.url);
    box.appendChild(t);
  });
  updateShelf();
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function updateShelf(){
  const h=hist[0];
  if(!h) return;
  $("shelfKicker").textContent="Son gönderilen";
  $("shelfTitle").textContent=h.title||host(h.url);
  $("shelfSub").textContent=h.url;
  const th=thumb(h.url);
  $("shelfBg").style.backgroundImage = th?`url(${th.replace("hqdefault","maxresdefault")}), url(${th})`:"";
}
$("shelf").onclick=()=>{ if(hist[0]) launch(hist[0].url); };
renderHist();

// ---- Title lookup (YouTube vb. için) ----
function fetchTitle(item){
  if(item.title) return;
  fetch("https://noembed.com/embed?url="+encodeURIComponent(item.url)).then(r=>r.json()).then(j=>{
    if(!j||!j.title) return;
    item.title=j.title; hist=hist.map(h=>h.url===item.url?Object.assign(h,{title:j.title}):h);
    store.set("hist",hist); renderHist();
    if(pending) $("tTitle").textContent=j.title;
  }).catch(()=>{});
}

// ---- Incoming ----
let pending=null;
function incoming(msg){
  let data;
  try{ data=JSON.parse(msg); }catch(e){ data={url:msg.trim()}; }
  if(!data) return;
  const t=data.t||"open";
  if(t==="wake"){ toFront(); banner("iPhone bağlandı"); return; }
  if(t==="home"){ toFront(); cancelPending(); focusAt(1,0); banner("Ana ekran"); return; }
  if(t==="app"){
    const a=APPS.find(x=>x.id===data.id); if(!a) return;
    toFront(); banner(a.name+" açılıyor…"); setTimeout(()=>launchApp(a),600); return;
  }
  if(!data.url) return;
  let url=String(data.url).trim();
  const m=url.match(/https?:\/\/\S+/); if(m) url=m[0];
  else if(/^[\w-]+(\.[\w-]+)+/.test(url)) url="https://"+url;
  else return;
  const item={url,title:data.title||"",ts:Date.now()};
  hist=[item,...hist.filter(h=>h.url!==url)].slice(0,MAX_HIST);
  store.set("hist",hist); renderHist();
  toFront();
  if(data.now) { launch(url); fetchTitle(item); return; }
  showToast(item);
  fetchTitle(item);
}
let bannerT;
function banner(text){
  $("tTitle").textContent=text; $("tUrl").textContent=""; $("tImg").style.display="none";
  $("tBar").style.transition="none"; $("tBar").style.width="0";
  ["tBarW","tHint","tK"].forEach(i=>$(i).style.display="none");
  $("toast").classList.add("show"); clearTimeout(bannerT);
  bannerT=setTimeout(()=>{ if(!pending) $("toast").classList.remove("show"); },2200);
}
function showToast(item){
  cancelPending(); clearTimeout(bannerT);
  ["tBarW","tHint","tK"].forEach(i=>$(i).style.display="");
  $("tTitle").textContent=item.title||host(item.url)||"Link";
  $("tUrl").textContent=item.url;
  const th=thumb(item.url);
  $("tImg").style.display=th?"":"none"; if(th) $("tImg").src=th;
  const bar=$("tBar"); bar.style.transition="none"; bar.style.width="0";
  $("toast").classList.add("show");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transition=`width ${OPEN_DELAY_MS}ms linear`; bar.style.width="100%"; }));
  pending=setTimeout(()=>{ $("toast").classList.remove("show"); pending=null; launch(item.url); },OPEN_DELAY_MS);
}
function cancelPending(){
  if(pending){ clearTimeout(pending); pending=null; }
  $("toast").classList.remove("show");
}

// ---- ntfy subscription (Server-Sent Events) ----
let es;
function connect(){
  try{ es&&es.close(); }catch(e){}
  es=new EventSource(`${NTFY}/${topic}/sse`);
  es.onopen=()=>{ $("dot").classList.add("on"); $("status").textContent="iPhone'a hazır"; };
  es.onerror=()=>{ $("dot").classList.remove("on"); $("status").textContent="Yeniden bağlanıyor…"; };
  es.onmessage=e=>{
    try{ const ev=JSON.parse(e.data); if(ev.event==="message" && ev.message) incoming(ev.message); }catch(err){}
  };
}
connect();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && (!es||es.readyState===2)) connect(); });

// ---- Remote (D-pad) navigation ----
let pos={row:1,col:0};
function rowEls(r){ return [...document.querySelectorAll(`.focusable[data-row="${r}"]`)]; }
function focusAt(r,c){
  const els=rowEls(r); if(!els.length) return false;
  c=Math.max(0,Math.min(c,els.length-1));
  document.querySelectorAll(".focus").forEach(x=>x.classList.remove("focus"));
  const el=els[c]; el.classList.add("focus"); el.focus({preventScroll:true});
  const row=el.parentElement;
  if(row.classList.contains("row")){
    const left=el.offsetLeft-row.clientWidth/2+el.clientWidth/2;
    row.scrollLeft=Math.max(0,left);
  }
  pos={row:r,col:c}; return true;
}
function move(dr,dc){
  if(dr){ let r=pos.row+dr; while(r>=0&&r<=2){ if(rowEls(r).length){ focusAt(r, r===0?0:Math.min(pos.col,rowEls(r).length-1)); return;} r+=dr; } return; }
  focusAt(pos.row,pos.col+dc);
}
document.addEventListener("keydown",e=>{
  const k=e.key;
  if(pending && (k==="Escape"||k==="Backspace"||k==="GoBack"||e.keyCode===4)){ e.preventDefault(); cancelPending(); return; }
  if(k==="ArrowRight"){ e.preventDefault(); move(0,1); }
  else if(k==="ArrowLeft"){ e.preventDefault(); move(0,-1); }
  else if(k==="ArrowDown"){ e.preventDefault(); move(1,0); }
  else if(k==="ArrowUp"){ e.preventDefault(); move(-1,0); }
  else if(k==="Enter"||k===" "){ e.preventDefault(); const el=document.querySelector(".focus"); el&&el.click(); }
});
focusAt(1,0);
</script>
</body>
</html>
